defaults:
  - launcher: local
  - solver: cem
  - objective: goal_mse
  - _self_

world:
  env_name: swm/OGBCube-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget
  env_type: double # 2 cubes -> enables task5_stack (stacking)
  ob_type: states
  multiview: False
  width: 224
  height: 224
  visualize_info: False
  terminate_at_goal: True

objective:
  pred_key: predicted_embedding # key PreJEPA's rollout writes

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action

seed: 42
policy: random # ckpt name (a trained DINO-WM/PreJEPA run) or random

plan_config:
  horizon: 5
  receding_horizon: 5
  history_len: 3 # must match the trained model's history_size
  action_block: 1 # frameskip=1

# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 32
  goal_at_end: true # goal = episode's final frame (the completed tower)
  init_first_goal_last: false # true = start from first frame (build from scratch)
  goal_offset_steps: 5 # start this many steps before the goal
  eval_budget: 20
  img_size: 224
  dataset_name: ogbench/cube_double_fullstack.lance
  callables:
    # -- set state
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    # -- set target pos for cube 0
    - method: set_target_pos
      args:
        cube_id:
          value: 0
          in_dataset: False
        target_pos:
          value: goal_privileged/block_0_pos
        target_quat:
          value: goal_privileged/block_0_quat
    # -- set target pos for cube 1 (the extra cube for double/stacking)
    - method: set_target_pos
      args:
        cube_id:
          value: 1
          in_dataset: False
        target_pos:
          value: goal_privileged/block_1_pos
        target_quat:
          value: goal_privileged/block_1_quat

output:
  filename: ogb_cube_double_results.txt
